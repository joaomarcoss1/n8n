# Assistente Jurídico 24h
# n8n (orquestração + IA) · Evolution API (WhatsApp) · Chatwoot (atendimento humano)
# Painel web do escritório
# Postgres + pgvector · Redis · Caddy (HTTPS automático)
#
# Uso: sudo ./install.sh seudominio.com.br voce@email.com
# ou:  docker compose up -d && ./scripts/importar-fluxos.sh

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  RAILS_LOG_TO_STDOUT: "true"
  LOG_LEVEL: info
  DEFAULT_LOCALE: pt_BR
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
  FRONTEND_URL: https://${CHATWOOT_SUBDOMAIN}.${DOMAIN}
  ENABLE_ACCOUNT_SIGNUP: "false"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USERNAME: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  ACTIVE_STORAGE_SERVICE: local

services:
  postgres:
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PAINEL_DB_PASSWORD: ${PAINEL_DB_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/00-databases.sh:/docker-entrypoint-initdb.d/00-databases.sh:ro
      - ./postgres/painel-db-role.sh:/usr/local/bin/painel-db-role.sh:ro
      - ./postgres/agente-schema.sql:/schemas/agente-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_SUBDOMAIN}.${DOMAIN}
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      N8N_WEBHOOK_URL: https://${N8N_SUBDOMAIN}.${DOMAIN}/
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_DEFAULT_LOCALE: pt-BR
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "300"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336" # 14 dias de histórico de execuções
    volumes:
      - n8n_data:/home/node/.n8n
      - ./fluxos:/fluxos:ro
      - ./.credenciais-tmp:/credenciais:ro
    depends_on:
      postgres:
        condition: service_healthy

  evolution:
    image: evoapicloud/evolution-api:${EVOLUTION_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: https://${EVOLUTION_SUBDOMAIN}.${DOMAIN}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      LANGUAGE: pt-BR
      DEL_INSTANCE: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/2
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      CHATWOOT_ENABLED: "true"
      CHATWOOT_MESSAGE_READ: "true"
      CHATWOOT_IMPORT_DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatwoot?sslmode=disable
      CONFIG_SESSION_PHONE_CLIENT: Assistente Juridico
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN,INFO
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot-rails:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *chatwoot-env
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  painel:
    build: ./painel
    image: assistente-juridico/painel:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://painel:${PAINEL_DB_PASSWORD}@postgres:5432/agente
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      N8N_URL: http://n8n:5678
      PAINEL_N8N_SECRET: ${PAINEL_N8N_SECRET}
      COOKIE_SECURE: ${PAINEL_COOKIE_SECURE:-true}
      SESSAO_HORAS: "12"
      TZ: ${TZ:-America/Sao_Paulo}
    # endurecimento: sistema de arquivos só leitura, sem privilégios extras
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      N8N_SUBDOMAIN: ${N8N_SUBDOMAIN}
      EVOLUTION_SUBDOMAIN: ${EVOLUTION_SUBDOMAIN}
      CHATWOOT_SUBDOMAIN: ${CHATWOOT_SUBDOMAIN}
      PAINEL_SUBDOMAIN: ${PAINEL_SUBDOMAIN:-painel}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n
      - evolution
      - chatwoot-rails
      - painel

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
  chatwoot_storage:
  caddy_data:
  caddy_config:
